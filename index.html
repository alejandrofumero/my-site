  <style>
    body {
      min-height: 100dvh;
      background-color: #000000;
      background-image: radial-gradient(#11581e, #041607),
        url("https://media.giphy.com/media/oEI9uBYSzLpBK/giphy.gif");
      background-repeat: no-repeat;
      background-size: cover;
      margin: 0;
      padding: 0;
    }
    .logo {
      width: 40%;
      min-width: 200px;
      max-width: 600px;
      position: absolute;
      left: 50%;
      top: 50%;
      translate: -60% -50%;
    }
    .logo path {
      fill: none;
      stroke-width: 0.5px;
      stroke: #091d0b;
      filter: blur(1px);
    }
    .terminal {
      position: absolute;
      height: 100%;
      width: 100%;
    }
    .noise {
      pointer-events: none;
      position: absolute;
      width: 100%;
      height: 100%;
      background-image: url("https://media.giphy.com/media/oEI9uBYSzLpBK/giphy.gif");
      background-repeat: no-repeat;
      background-size: cover;
      z-index: -1;
      opacity: 0.02;
    }

    .overlay {
      pointer-events: none;
      position: absolute;
      width: 100%;
      height: 100%;
      background: repeating-linear-gradient(
        180deg,
        rgba(0, 0, 0, 0) 0,
        rgba(0, 0, 0, 0.3) 50%,
        rgba(0, 0, 0, 0) 100%
      );
      background-size: auto 4px;
      z-index: 1;
    }

    .overlay::before {
      content: "";
      pointer-events: none;
      position: absolute;
      display: block;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      height: 100%;
      background-image: linear-gradient(
        0deg,
        transparent 0%,
        rgba(32, 128, 32, 0.2) 2%,
        rgba(32, 128, 32, 0.8) 3%,
        rgba(32, 128, 32, 0.2) 3%,
        transparent 100%
      );
      background-repeat: no-repeat;
      -webkit-animation: scan 7.5s linear 0s infinite;
      animation: scan 7.5s linear 0s infinite;
    }

    @-webkit-keyframes scan {
      0% {
        background-position: 0 -100vh;
      }
      35%,
      100% {
        background-position: 0 100vh;
      }
    }

    @keyframes scan {
      0% {
        background-position: 0 -100vh;
      }
      35%,
      100% {
        background-position: 0 100vh;
      }
    }
    .networking {
      position: absolute;
      bottom: 1em;
      left: 50%;
      translate: -50% 0%;
      display: flex;
      flex-direction: row;
      gap: 1em;
    }
    .networking a svg {
      width: 1.25rem;
      height: 1.25rem;
      fill: #00c414;
    }
  </style>
